name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet ruff pytest

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest

      - name: Render from the fixture
        run: |
          cp README.md "$RUNNER_TEMP/README.md"
          python -m profile_readme render \
            --data tests/fixtures/contributions.json \
            --readme "$RUNNER_TEMP/README.md" \
            --charts "$RUNNER_TEMP/charts"
          test -s "$RUNNER_TEMP/charts/oss-summary-light.svg"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --accept 200,204,429 --exclude 'linkedin\.com' README.md
